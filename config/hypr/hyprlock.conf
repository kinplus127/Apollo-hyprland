# Minimal hyprlock — ~/.config/hypr/hyprlock.conf
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

general {
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    color = rgba(20, 20, 20, 1.0)
}

input-field {
    monitor =
    size = 300, 50
    position = 0, -80
    halign = center
    valign = center
    placeholder_text = Password
}
