<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Hyprland-setup system font stack
     Installed to ~/.config/fontconfig/fonts.conf
     sans → Geist + Noto Sans CJK HK + emoji
     serif → Noto Sans CJK HK (no separate serif chosen yet)
     monospace → Geist Mono + Noto Sans Mono CJK HK + Nerd Symbols
-->
<fontconfig>
  <!-- Prefer our families for generic names -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Geist</family>
      <family>Noto Sans CJK HK</family>
      <family>Noto Color Emoji</family>
      <family>Symbols Nerd Font</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>Geist</family>
      <family>Noto Sans CJK HK</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>Geist Mono</family>
      <family>Noto Sans Mono CJK HK</family>
      <family>Symbols Nerd Font Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Common app requests -->
  <alias binding="strong">
    <family>sans</family>
    <prefer><family>sans-serif</family></prefer>
  </alias>
  <alias binding="strong">
    <family>mono</family>
    <prefer><family>monospace</family></prefer>
  </alias>

  <!-- Emoji: force color emoji for emoji presentation -->
  <match target="pattern">
    <test name="family"><string>emoji</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- When any font misses a glyph, try CJK then emoji then nerd symbols -->
  <match target="pattern">
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans CJK HK</string>
      <string>Noto Color Emoji</string>
      <string>Symbols Nerd Font</string>
    </edit>
  </match>
</fontconfig>
